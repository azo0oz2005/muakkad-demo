<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة مؤكد</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/platform/platform.css"></head><body><main class="shell"><header class="top"><div><div class="brand">إدارة مؤكد</div><p class="muted">المكاتب والتجارب</p></div><button class="secondary" id="logout">خروج</button></header><section id="passwordBox" class="panel hidden"><h2>غيّر كلمة المرور المؤقتة</h2><form id="passwordForm" class="actions"><input id="newPassword" type="password" minlength="10" required placeholder="10 أحرف على الأقل"><button class="primary">حفظ</button></form></section><section class="panel"><h1>إضافة مكتب</h1><form id="officeForm" class="settings" enctype="multipart/form-data"><label class="field">اسم المكتب<input name="name" required></label><label class="field">الرابط المختصر<input name="slug" dir="ltr" pattern="[a-z0-9-]+" required></label><label class="field">واتساب<input name="whatsapp" dir="ltr" required></label><label class="field">سعر الاستشارة<input name="price" type="number" value="250" min="0"></label><label class="field">المدة<input name="duration" type="number" value="30" min="10"></label><label class="field">شعار المكتب<input name="logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><label class="field">البنك<input name="bankName"></label><label class="field">المستفيد<input name="accountName"></label><label class="field wide">الآيبان<input name="iban" dir="ltr"></label><label class="field">بريد المحامي<input name="email" type="email" required></label><label class="field">كلمة مرور مؤقتة<input name="password" type="password" minlength="10" required></label><label class="field wide">سياسة الإلغاء<textarea name="cancelPolicy"></textarea></label><button class="primary">إنشاء المكتب</button><p id="formMsg"></p></form></section><section class="panel" style="margin-top:18px"><h2>المكاتب</h2><div id="offices"></div></section></main><script src="/platform/admin.js"></script></body></html>
